packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # swagger-ui-dist pulls this in; its install script reports the install to
  # scarf.sh. Nothing in the app needs it to have run.
  '@scarf/scarf': false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
overrides:
  # Transitive dependencies pinned to their patched releases. Each closes an open
  # Dependabot advisory that nothing in the tree requests a fixed range for yet:
  #   postcss   >=8.5.23  CVE-2026-69153  arbitrary .map read via sourceMappingURL
  #   undici    >=7.29.0  CVE-2026-15157 / -14643 / -16729 / -16728
  #   @auth/core >=0.41.3 CVE-2026-73419  OAuth state/nonce/PKCE cookies not
  #                                       bound to the provider that set them
  #   qs        >=6.16.0  CVE-2026-82562  array-limit bypass via bracket-key
  #                                       comma parsing
  #             (also)    CVE-2026-82417  DoS via attacker-controlled isBuffer
  #   fast-uri  >=3.1.6   CVE-2026-75899  SSRF via repeated hostname
  #                                       percent-decoding
  #             (also)    CVE-2026-75931  host confusion, skipped IDN
  #                                       canonicalization on scheme-relative refs
  #             (also)    CVE-2026-75975  SSRF via malformed IPv6 normalization
  #             (also)    CVE-2026-76172  host confusion via percent-encoded
  #                                       scheme normalization
  postcss: ">=8.5.23"
  # Constrained to the 7.x line: 7.29.0 is the patched release, and a major bump
  # to 8.x on a transitive fetch dependency is not something a security patch
  # should drag in.
  undici: ">=7.29.0 <8"
  "@auth/core": ">=0.41.3"
  esbuild: ">=0.25.0"
  # Both of these are reached only through the mutation-testing toolchain —
  # @stryker-mutator/core -> typed-rest-client for `qs`, and the same core -> ajv
  # for `fast-uri`. Neither is in either shipped app, so no request from a user
  # ever reaches them. Pinned anyway: a dev-only advisory is still an advisory,
  # both fixes are patch releases, and leaving one open trains people to skim the
  # list.
  #
  # `qs` was already pinned at >=6.15.2 for an earlier stringify DoS; 6.15.3
  # satisfied that and is still vulnerable to the two 2026-82xxx advisories, so
  # the floor moves rather than a new entry appearing.
  qs: ">=6.16.0"
  # Constrained to the 3.x line for the same reason as undici: ajv declares
  # `fast-uri: ^3.0.1`, 3.1.6 is the patched release on that line, and a
  # security patch should not be the thing that drags a major bump into a
  # transitive dependency its parent never asked for.
  fast-uri: ">=3.1.6 <4"
  # Reached only through eslint (`@eslint/eslintrc` parses YAML config), so no
  # request from a user ever reaches it. Pinned for the same reason as `qs` and
  # `fast-uri` above: a dev-only advisory is still an advisory, and 4.3.2 is a
  # patch release on the line eslint already asks for.
  #   js-yaml  >=4.3.2  GHSA (maxTotalMergeKeys does not bound CPU for an empty
  #                     merge source, so a crafted config can spin)
  js-yaml: ">=4.3.2 <5"
  # ── Held one release back, and ONLY because of their age ──────────────────
  #
  # pnpm 11 rejects a lockfile entry published inside `minimumReleaseAge`, which
  # is the right default: a package hours old is the shape a compromised release
  # arrives in, and these three are exactly the kind that gets targeted — a nanoid
  # and a napi runtime reach almost everything.
  #
  # Next 15.5.24 resolved all three to versions published the same day, so the
  # bump could not install. Pinning to the previous release keeps the guard fully
  # enforced rather than switching it off or regenerating the lockfile around it,
  # which is what the error message warns against.
  #
  # Nothing here is a fix or a constraint that matters — REMOVE these three the
  # next time this file is touched. They are dated so a reader can see they have
  # long since aged out:
  #   @csstools/css-syntax-patches-for-csstree 1.1.13  published 2026-09-10
  #   @napi-rs/wasm-runtime                    1.2.4   published 2026-09-10
  #   nanoid                                   3.3.19  published 2026-09-10
  "@csstools/css-syntax-patches-for-csstree": "1.1.12"
  "@napi-rs/wasm-runtime": "1.2.3"
  nanoid: "3.3.18"
