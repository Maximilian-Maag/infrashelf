{{- /* ── Frontend secret ─────────────────────────────────────────────────── */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infrashelf.frontend.fullname" . }}
  labels:
    {{- include "infrashelf.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ required "frontend.secrets.nextauthSecret is required" .Values.frontend.secrets.nextauthSecret | quote }}
---
{{- /* ── Backend secret ──────────────────────────────────────────────────── */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infrashelf.backend.fullname" . }}
  labels:
    {{- include "infrashelf.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  DATABASE_URL: {{ required "backend.secrets.databaseUrl is required" .Values.backend.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ required "backend.secrets.jwtSecret is required" .Values.backend.secrets.jwtSecret | quote }}
  ADMIN_PASSWORD: {{ required "backend.secrets.adminPassword is required" .Values.backend.secrets.adminPassword | quote }}
  {{- with .Values.backend.secrets.totpEncryptionKey }}
  TOTP_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.env.smtp }}
  {{- if .pass }}
  SMTP_PASS: {{ .pass | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.decommissionSweep.enabled }}
  DECOMMISSION_SWEEP_SECRET: {{ required "decommissionSweep.secret is required when decommissionSweep.enabled" .Values.decommissionSweep.secret | quote }}
  {{- end }}
  {{- if .Values.deploymentWindowSweep.enabled }}
  DEPLOYMENT_WINDOW_SWEEP_SECRET: {{ required "deploymentWindowSweep.secret is required when deploymentWindowSweep.enabled" .Values.deploymentWindowSweep.secret | quote }}
  {{- end }}
  {{- /* Optional, not `required`: there is no `enabled` flag to pair it with, and
         an existing release that never configured one must keep deploying. Both
         drift endpoints then stay disabled (503), which is the safe default. */}}
  {{- with .Values.driftReport.secret }}
  DRIFT_REPORT_SECRET: {{ . | quote }}
  {{- end }}
  {{- /* Optional, not `required`: there is no `enabled` flag to pair it with,
         and an existing release that never configured one must keep deploying.
         The metrics endpoint (#548) then stays disabled (503), which is the safe
         default — the response describes the estate. */}}
  {{- with .Values.metrics.secret }}
  METRICS_SECRET: {{ . | quote }}
  {{- end }}
  {{- /* Optional, not `required`: an existing release that never configured a key
         must keep deploying. The integration registry (issue #111) then refuses
         to store credentials rather than storing them in plain text. */}}
  {{- if .Values.backend.secrets.secretEncryptionKey }}
  SECRET_ENCRYPTION_KEY: {{ .Values.backend.secrets.secretEncryptionKey | quote }}
  {{- end }}
