apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrashelf.backend.fullname" . }}
  labels:
    {{- include "infrashelf.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "infrashelf.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "infrashelf.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "infrashelf.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: ADMIN_EMAIL
              value: {{ .Values.backend.env.adminEmail | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.backend.env.frontendUrl | quote }}
            - name: EXCHANGE_RATE_API_URL
              value: {{ .Values.backend.env.exchangeRateApiUrl | quote }}
            {{- if .Values.decommissionSweep.enabled }}
            # Presence of this secret is what enables POST
            # /api/internal/decommission-sweep; without it the endpoint returns
            # 503 rather than accepting unauthenticated calls.
            - name: DECOMMISSION_SWEEP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" . }}
                  key: DECOMMISSION_SWEEP_SECRET
            {{- end }}
            {{- if .Values.deploymentWindowSweep.enabled }}
            # Presence of this secret is what enables POST
            # /api/internal/deployment-window-sweep (#330); without it the
            # endpoint returns 503 and a scheduled order waits for ever.
            - name: DEPLOYMENT_WINDOW_SWEEP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" . }}
                  key: DEPLOYMENT_WINDOW_SWEEP_SECRET
            {{- end }}
            {{- if .Values.driftReport.secret }}
            # Presence of this secret is what enables the scheduled drift loop
            # (issue #108) — GET /api/internal/drift-targets and
            # POST /api/internal/drift-report. Without it both return 503 rather
            # than answering an unauthenticated caller.
            - name: DRIFT_REPORT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" . }}
                  key: DRIFT_REPORT_SECRET
            {{- end }}
            {{- with .Values.backend.env.smtp }}
            {{- if .host }}
            - name: SMTP_HOST
              value: {{ .host | quote }}
            - name: SMTP_PORT
              value: {{ .port | quote }}
            - name: SMTP_FROM
              value: {{ .from | quote }}
            - name: SMTP_USER
              value: {{ .user | quote }}
            - name: SMTP_TLS
              value: {{ .tls | quote }}
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" . }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" . }}
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" . }}
                  key: ADMIN_PASSWORD
            {{- with .Values.backend.secrets.totpEncryptionKey }}
            - name: TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" $ }}
                  key: TOTP_ENCRYPTION_KEY
            {{- end }}
            {{- with .Values.backend.webauthn }}
            {{- if .rpId }}
            # Plain env, not a secret: these are public identifiers the browser
            # already knows. Required in production — see values.yaml (#197).
            - name: WEBAUTHN_RP_ID
              value: {{ .rpId | quote }}
            {{- end }}
            {{- if .rpOrigin }}
            - name: WEBAUTHN_RP_ORIGIN
              value: {{ .rpOrigin | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.backend.env.smtp }}
            {{- if .pass }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" $ }}
                  key: SMTP_PASS
            {{- end }}
            {{- end }}
            {{- if .Values.backend.secrets.secretEncryptionKey }}
            # Optional, and the secret only carries this key when it is set, so
            # the reference has to be conditional too: an unconditional
            # secretKeyRef would hold the pod in CreateContainerConfigError on
            # every release that leaves the integration registry off.
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infrashelf.backend.secretName" . }}
                  key: SECRET_ENCRYPTION_KEY
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
