{{- if .Values.decommissionSweep.enabled }}
{{- /*
  Scheduled decommissioning sweep (issue #30).

  The backend has no worker process and no in-process scheduler: pipeline status
  arrives by inbound webhook, and the deployment is horizontally scaled, so an
  interval inside the app would fire once per replica. This CronJob is the single
  caller instead.

  Overlap is concurrencyPolicy: Forbid for tidiness only — the sweep's atomic
  active -> decommissioning claim already makes concurrent runs safe.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "infrashelf.fullname" . }}-decommission-sweep
  labels:
    {{- include "infrashelf.labels" . | nindent 4 }}
    app.kubernetes.io/component: decommission-sweep
spec:
  schedule: {{ .Values.decommissionSweep.schedule | quote }}
  concurrencyPolicy: Forbid
  # A run missed while the controller was down is skipped rather than fired at
  # some arbitrary later moment. The sweep is idempotent and runs every quarter
  # hour; catching up is not worth a decommission at an unexpected time.
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Bounded, because `Forbid` above turns an unbounded run into a permanent
      # outage rather than a slow one: a Job that stays Active suppresses EVERY
      # later sweep, so scheduled decommissioning simply stops, expired
      # infrastructure keeps running and costing money, and nothing says why
      # (#366).
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "infrashelf.labels" . | nindent 12 }}
            app.kubernetes.io/component: decommission-sweep
        spec:
          restartPolicy: Never
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sweep
              image: curlimages/curl:8.11.1
              # --fail-with-body so a 401/503 fails the Job (and shows why in the
              # logs) instead of passing silently. 207 is a partial success — some
              # teardowns started, some could not — and must NOT fail the Job, so
              # it is matched explicitly.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # --max-time for a backend that accepts and then stalls;
                  # --connect-timeout separately, because a Service with no
                  # ready endpoints hangs at connect and that is the ordinary
                  # shape of a rolling deploy rather than an exception.
                  STATUS=$(curl -sS -o /tmp/out -w '%{http_code}' \
                    --connect-timeout 5 --max-time 120 \
                    -X POST \
                    -H "X-Sweep-Secret: ${DECOMMISSION_SWEEP_SECRET}" \
                    "http://{{ include "infrashelf.backend.fullname" . }}:{{ .Values.backend.service.port }}/api/internal/decommission-sweep")
                  cat /tmp/out
                  echo
                  case "$STATUS" in
                    200) exit 0 ;;
                    207) echo "sweep partially failed — see the failed[] entries above"; exit 0 ;;
                    *)   echo "sweep failed with HTTP $STATUS"; exit 1 ;;
                  esac
              env:
                - name: DECOMMISSION_SWEEP_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "infrashelf.backend.secretName" . }}
                      key: DECOMMISSION_SWEEP_SECRET
              {{- with .Values.decommissionSweep.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
