# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  replicaCount: 2

  image:
    repository: your-dockerhub-username/infrashelf-frontend
    pullPolicy: IfNotPresent
    # Overrides Chart.appVersion when set
    tag: ""

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  env:
    nextauthUrl: "https://shop.example.com"
    # NEXT_PUBLIC_API_URL is baked in at build time; set via build args.
    # Runtime server-side API URL (container-internal)
    apiUrl: "http://infrashelf-backend:3001"

  # Secrets — provide via --set or a separate secrets values file
  secrets:
    nextauthSecret: ""    # NEXTAUTH_SECRET  32+ random bytes

# ── Scheduled decommissioning (issue #30) ─────────────────────────────────────
# Drives POST /api/internal/decommission-sweep, which tears down infrastructure
# whose scheduled_decommission_at has arrived.
#
# A CronJob rather than a timer inside the backend: the backend is horizontally
# scaled (see backend.autoscaling), so an in-process interval would run once per
# replica. The sweep is safe either way — its active → decommissioning claim is
# atomic, so overlapping runs cannot double-destroy — but one caller is enough.
#
# `schedule` is the granularity of the feature: an element is torn down at the
# first sweep at or after its scheduled time, not to the second.
decommissionSweep:
  enabled: false
  schedule: "*/15 * * * *"
  # Shared secret sent as X-Sweep-Secret. Required when enabled; the endpoint
  # stays disabled (503) while unset, so it can never be called anonymously.
  secret: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── Deployment window sweep (issue #330) ──────────────────────────────────────
# Releases approved orders once the window they are waiting for opens. Only
# needed where at least one environment sets `respectsDeploymentWindows`; with
# it disabled a scheduled order waits for ever, so the portal warns rather than
# scheduling if no window can open.
deploymentWindowSweep:
  enabled: false
  # Every two minutes, not every fifteen. This interval IS the delay between a
  # window opening and the orders deploying, and an admin who came in to watch
  # the 08:00 deployment should not be watching an empty screen at 08:14.
  schedule: "*/2 * * * *"
  # Shared secret sent as X-Sweep-Secret. Required when enabled; the endpoint
  # stays disabled (503) while unset, so it can never be called anonymously.
  secret: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ── Scheduled drift report (issue #108) ───────────────────────────────────────
# There is no CronJob here, unlike decommissionSweep above, and that is
# deliberate: the reporter is a pipeline SCHEDULE in the infra-templates project
# because it needs an OpenTofu toolchain and the Terraform state backend's
# credentials, neither of which belongs in this chart. All this section does is
# hand the backend the secret that authorises the two endpoints that pipeline
# calls.
driftReport:
  # Shared secret, sent by the pipeline as X-Drift-Secret. It authorises BOTH
  # GET /api/internal/drift-targets (the work list) and
  # POST /api/internal/drift-report (what the plans found). While it is unset
  # both endpoints return 503, so neither can be called anonymously — set the
  # same value on the infra-templates pipeline schedule.
  secret: ""

# ── Metrics (issue #548) ──────────────────────────────────────────────────────
# Bearer token for GET /api/internal/metrics: the endpoint the Prometheus a
# deployment runs scrapes, and the metric source for the two dashboards in
# infra/grafana. Prometheus and Grafana both take a bearer credential directly,
# so there is nothing else to wire here — no exporter sidecar, no chart change.
#
# Blank leaves the endpoint disabled (503), which is the safe default: the
# response describes the estate, so it must not be readable anonymously. Scrape
# config, datasource and mounting instructions: infra/grafana/README.md.
metrics:
  secret: ""

# ── Backend ───────────────────────────────────────────────────────────────────
backend:
  replicaCount: 2

  image:
    repository: your-dockerhub-username/infrashelf-backend
    pullPolicy: IfNotPresent
    # Overrides Chart.appVersion when set
    tag: ""

  service:
    type: ClusterIP
    port: 3001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  env:
    adminEmail: "admin@example.com"
    frontendUrl: "https://shop.example.com"
    exchangeRateApiUrl: "https://api.exchangerate.host/latest"

    # Optional — SMTP
    smtp:
      host: ""
      port: "587"
      from: ""
      user: ""
      pass: ""
      tls: "true"

  # Secrets — provide via --set or a separate secrets values file
  secrets:
    databaseUrl: ""     # DATABASE_URL  postgresql://user:pass@host:5432/db
    jwtSecret: ""       # JWT_SECRET    32+ random bytes
    adminPassword: ""   # ADMIN_PASSWORD  initial admin account password
    # SECRET_ENCRYPTION_KEY — 64 hex characters (`openssl rand -hex 32`). Encrypts
    # the credentials in the integration registry (Foreman, Ansible, Nexus, Pulp,
    # Loki, Grafana). Leave empty to leave that feature off; the endpoints then
    # refuse to store a credential rather than storing it in plain text.
    #
    # Cannot currently be rotated: a new key cannot decrypt what the old one
    # wrote, and every stored credential would have to be re-entered.
    secretEncryptionKey: ""
    # TOTP_ENCRYPTION_KEY — encrypts the root account's second-factor secret at
    # rest. 32 bytes, hex or base64: `openssl rand -base64 32`. Blank derives it
    # from jwtSecret, which works but means rotating jwtSecret invalidates every
    # enrolled authenticator.
    totpEncryptionKey: ""

  # ── Security keys / passkeys (issue #197) ───────────────────────────────────
  # WEBAUTHN_RP_ID is a bare domain — no scheme, no port. WEBAUTHN_RP_ORIGIN is
  # the full origin the browser sees, with scheme; comma-separate several if the
  # portal answers on more than one hostname, and the RP ID must be a suffix of
  # each. Both are required in production: the backend refuses to start a
  # ceremony without them rather than issuing credentials nobody can use.
  #
  # These are NOT secrets — they are public identifiers the browser already
  # knows — which is why they sit here and not under `secrets` above.
  #
  # Set them to match `ingress.hosts[0].host`. Changing rpId later invalidates
  # every registered credential, so pick the broadest domain you might want
  # before anyone enrols.
  webauthn:
    rpId: "shop.example.com"
    rpOrigin: "https://shop.example.com"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: shop.example.com
  tls:
    - secretName: infrashelf-tls
      hosts:
        - shop.example.com

# ── Database migration hook ───────────────────────────────────────────────────
migrate:
  # Run as a pre-install / pre-upgrade Helm hook via the backend image
  enabled: true

# ── Pod configuration (shared defaults) ──────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
