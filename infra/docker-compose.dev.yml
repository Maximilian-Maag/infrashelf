# Local development — mocks all external systems.
# The Next.js apps run locally via `pnpm dev`, not in Docker.
# Start with: docker compose -f infra/docker-compose.dev.yml up -d

# Named explicitly. Compose otherwise derives the project name from the
# directory holding this file — `infra` — so any other checkout on the machine
# with its own `infra/` compose file lands in the SAME project: one set of
# containers, one network, one set of volumes. Starting either stack then
# recreates the other's containers, and `down -v` in either destroys both
# products' data.
name: infrashelf

services:

  # ── Database ──────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: isf-postgres
    environment:
      POSTGRES_DB: infrashelf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the test and e2e databases on a FRESH volume. An existing volume
      # never runs these — use `make test-db` there.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infrashelf"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - dev

  # ── SMTP mock (catches all outgoing emails) ───────────────────────────────────

  mailpit:
    # Pinned, like every other image here: the e2e suite reads mail out of this
    # container, and a silent upstream bump breaks a suite nobody changed on a
    # machine nobody touched. v1.30.1 is what the dev stack is running (#180).
    image: axllent/mailpit:v1.30.1
    container_name: isf-mailpit
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # Web UI → http://localhost:8025
    networks:
      - dev

  # ── CI provider + Exchange Rate API mock (WireMock) ───────────────────────────
  # Mocks: GitLab API v4, GitHub API, Bitbucket API, Exchange Rate API
  # Admin UI → http://localhost:8080/__admin
  # To simulate a completed pipeline, POST to:
  #   http://localhost:3001/api/webhooks/gitlab/pipeline
  # with body: {"object_kind":"pipeline","object_attributes":{"id":"42","status":"success"}}
  # and header: X-Gitlab-Token: dev-webhook-token

  wiremock:
    # 3.13.2, the version the stub mappings in ./wiremock/mappings were written
    # against and the one currently running. This is the pin that matters most:
    # the e2e suite depends on those stubs answering exactly as they do today.
    image: wiremock/wiremock:3.13.2
    container_name: isf-wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--verbose", "--global-response-templating"]
    networks:
      - dev

  # ── Architecture documentation ────────────────────────────────────────────────

  structurizr-lite:
    # Pinned: the `latest` tag was replaced upstream with a deprecation-notice
    # stub that exits immediately (Structurizr Lite is being sunset). Pin to
    # the last working release until this is migrated to the successor tooling.
    image: structurizr/lite:2025.11.08
    container_name: isf-structurizr
    ports:
      - "8088:8080"   # Web UI → http://localhost:8088
    volumes:
      - ../docs/architecture:/usr/local/structurizr
    networks:
      - dev

volumes:
  postgres_data:

networks:
  dev:
    driver: bridge
