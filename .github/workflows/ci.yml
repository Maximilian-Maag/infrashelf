name: CI

on:
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Handbook ─────────────────────────────────────────────────────────────────
  # docs/handbook.pdf is not committed (it drifts from handbook.tex the moment
  # nobody regenerates it) — this job is the safety net: it catches a LaTeX
  # source that fails to compile before it merges, and hands reviewers a built
  # PDF as an artifact. The release workflow (cd-release.yml) builds the copy
  # that ships with each GitHub Release; `make handbook` builds one locally.
  handbook:
    name: Handbook (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether handbook.tex changed
        id: changed
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
               | grep -qx 'docs/handbook.tex'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile handbook (LaTeX)
        if: steps.changed.outputs.changed == 'true'
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: handbook.tex
          working_directory: docs
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Upload handbook artifact
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handbook-pdf
          path: docs/handbook.pdf
          retention-days: 7

  # ── Type-check & Lint ────────────────────────────────────────────────────────
  check:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Type-check types package
        run: pnpm --filter @open-hybrid-cloud/types exec tsc --noEmit

      - name: Type-check backend
        run: pnpm --filter backend exec tsc --noEmit

      - name: Type-check frontend
        run: pnpm --filter frontend exec tsc --noEmit

      - name: Lint backend
        run: pnpm --filter backend lint

      - name: Lint frontend
        run: pnpm --filter frontend lint

  # ── Test ─────────────────────────────────────────────────────────────────────
  #
  # One leg per app, so the seven-minute backend suite and the twenty-second
  # frontend one stop being the same seven and a half minutes. Only the backend
  # leg needs a database.
  test-matrix:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      # A frontend failure should not cancel the backend leg: knowing about both
      # is the point of splitting them.
      fail-fast: false
      matrix:
        app: [backend, frontend]
    services:
      # Present for both legs because a service block cannot be conditional per
      # matrix leg. The frontend suite ignores it, and an unused Postgres costs a
      # few seconds of startup — cheaper than hand-rolling `docker run` to avoid
      # it. The test database tunes itself for durability-free speed (see
      # src/test/database.ts), so nothing is needed on the server's command line.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_hybrid_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} test

  # The name branch protection knows. It stays green/red with the legs, so the
  # matrix can be reshaped without touching the protection rules.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "test-matrix: ${{ needs.test-matrix.result }}"
          [ "${{ needs.test-matrix.result }}" = "success" ]

  # ── Build ────────────────────────────────────────────────────────────────────
  #
  # No longer behind `test`: a build failure is not caused by a test failure, and
  # learning about both at once beats learning about them in sequence.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build backend
        run: pnpm --filter backend build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_hybrid_cloud

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-placeholder-not-used-at-runtime
          API_URL: http://localhost:3001

  # ── E2E ──────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_hybrid_cloud_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_hybrid_cloud_e2e
      JWT_SECRET: ci-e2e-jwt-secret-not-used-in-prod
      ADMIN_EMAIL: root@test.dev
      ADMIN_PASSWORD: testpassword123
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret-not-used-in-prod
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      E2E_BASE_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: root@test.dev
      E2E_ADMIN_PASSWORD: testpassword123
      # The e2e specs talk to the backend directly to build and tear down their
      # own fixtures (see e2e/api.ts) instead of leaving rows behind — issue #156.
      E2E_API_URL: http://localhost:3001
      # The GitLab the pipeline-callback journey triggers, and the same stub the
      # dev compose file serves (infra/wiremock). Without it the order in
      # e2e/webhook-callback.spec.ts has nothing to fire at, so the one seam that
      # turns an approved order into infrastructure stays untested — issue #157.
      E2E_WIREMOCK_URL: http://localhost:8080
      # Also WireMock: the rate refresh is otherwise a live call to the public
      # exchangerate.host, which makes a CI job depend on a third party being up.
      EXCHANGE_RATE_API_URL: http://localhost:8080/latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Not a `services:` entry: service containers start BEFORE the checkout, so
      # there is nothing to mount yet, and these stubs are files in the repo.
      - name: Start WireMock (stub GitLab)
        run: |
          docker run -d --name wiremock -p 8080:8080 \
            -v "$PWD/infra/wiremock/mappings:/home/wiremock/mappings:ro" \
            wiremock/wiremock:3.13.1 --global-response-templating
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/__admin/mappings >/dev/null && exit 0
            sleep 1
          done
          echo "WireMock did not become ready"; docker logs wiremock; exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The database is seeded by e2e/global-setup.ts rather than by a step here,
      # so a local run and a CI run start from the same catalogue. See the comment
      # there — a suite whose coverage depends on how much data happens to be
      # present is what issue #154 turned out to be.
      - name: Run E2E tests
        run: pnpm exec playwright test --grep-invert "Accessibility" --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json

      # A run that executes nothing reports green. Before #152 the report read
      # {"total": 283, "expected": 0, "skipped": 283, "ok": true} — every test
      # took an "empty database → test.skip()" branch and the job passed. The
      # budget is what stops that coming back silently. Every skip that remains
      # states its reason at the call site (the pattern a11y.spec.ts:368 already
      # used), so the count is small and a jump in it is a real signal.
      - name: Check the skip budget
        run: |
          node -e '
            const s = require("./e2e-results.json").stats
            console.log(`expected=${s.expected} skipped=${s.skipped} unexpected=${s.unexpected} flaky=${s.flaky}`)
            if (s.skipped > 3) {
              console.error(`${s.skipped} tests skipped — the budget is 3. A jump here means the`)
              console.error(`database was not seeded, or a spec grew a new silent skip branch.`)
              process.exit(1)
            }
            if (s.expected < 200) {
              console.error(`only ${s.expected} tests actually ran — something is short-circuiting the suite.`)
              process.exit(1)
            }
          '

      # Separate step so a red pipeline says which of the two broke. Covers
      # WCAG 2.1 A/AA on every page and dialog, plus the things axe cannot see:
      # focus visibility, accessible-name language, aria-current and
      # reduced-motion. Also re-scans the dashboard under a deliberately hostile
      # branding colour, because the chrome is painted on an operator-chosen
      # value and default-config scanning hid 235 of 246 failures.
      - name: Run accessibility gate (WCAG 2.1 AA)
        run: pnpm exec playwright test e2e/a11y.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
