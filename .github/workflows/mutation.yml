name: Mutation testing

on:
  # The full runs are far too slow for a pull request — the backend suite is
  # database-backed and single-threaded, so its full run is measured in hours.
  # Nightly is what establishes the baseline #127's gate can be set from.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Override the mutate glob (empty = the config default)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutate:
    name: Mutate (${{ matrix.app }})
    runs-on: ubuntu-latest
    # The backend leg is hours, the frontend leg is over an hour. Neither should
    # be cut short by the other, and neither should be cut short by the six-hour
    # default: say the limit out loud so a run that dies says why.
    #
    # The frontend was 60 and that is why it has had no completed score since
    # 2026-08-24: the run is CANCELLED part-way, which looks like an
    # infrastructure hiccup rather than a budget. The 2026-09-11 nightly reached
    # 57% at 57 minutes with ~42 more to go — about 100 minutes for the whole
    # thing, against a limit of 60. 180 matches what the release gate already
    # allows it, and a cancelled run reports nothing at all, which is the
    # failure mode #245 is trying to get out of.
    timeout-minutes: ${{ matrix.app == 'backend' && 330 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infrashelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Incremental mode reuses last night's verdicts for code that has not
      # changed, which is what turns "everything, always" into "what moved". The
      # file has to survive between runs; a cache keyed by run number with a
      # prefix restore is the cheapest place for something that is an
      # optimisation and never a correctness input.
      - name: Restore incremental report
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: apps/${{ matrix.app }}/reports/mutation/incremental.json
          key: stryker-${{ matrix.app }}-${{ github.run_number }}
          restore-keys: stryker-${{ matrix.app }}-

      # A `scope` is one string for a two-app matrix, and Stryker treats a glob
      # that matches nothing as a configuration error — "No tests were executed.
      # Stryker will exit prematurely" — not as "nothing to do". So a scoped run
      # for a backend file ran the backend leg fine and FAILED the frontend leg,
      # which marks the whole run failed and buries the number the run existed to
      # produce (#561). A leg the scope does not name should skip itself and say
      # so; that is what the person pressing the button meant.
      #
      # Matched with a shell glob rather than `compgen`/`find` so the answer is
      # the same one Stryker will get: a pattern that matches nothing stays
      # literal, and `-e` on it is false.
      - name: Does the scope name anything here?
        id: scope
        working-directory: apps/${{ matrix.app }}
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ -z "${SCOPE:-}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=false
          for pattern in $SCOPE; do
            for match in $pattern; do
              if [ -e "$match" ]; then found=true; fi
            done
          done
          if [ "$found" = false ]; then
            echo "::notice::scope '${SCOPE}' names no file in apps/${{ matrix.app }} — this leg has nothing to mutate"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Stryker
        if: steps.scope.outputs.skip != 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          # Only the backend leg uses it; harmless for the frontend.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # Through the environment, never interpolated into the script: a
          # workflow_dispatch input spliced into a `run:` block is shell injection
          # by whoever can press the button.
          SCOPE: ${{ inputs.scope }}
        run: |
          # pipefail: without it, `| tee` masks Stryker's exit code and a run that
          # breaks the 80% threshold reports success.
          set -o pipefail
          args=()
          if [ -n "${SCOPE:-}" ]; then
            args+=(--mutate "$SCOPE")
          fi
          # No colours and no progress bar, because this log is PARSED, not
          # watched. The progress reporter redraws itself with carriage returns
          # and `--allowConsoleColors` wraps every table cell in ANSI escapes —
          # between them `stryker.log` stopped being line-oriented text, which is
          # what the Summarise step below assumes it is reading. It is also what
          # made that step write megabytes into a job summary capped at 1024k.
          #
          # Nothing is lost: a progress bar in a non-interactive runner log is
          # 30,000 redraws of a bar nobody sees, and the HTML report uploaded
          # below is where the detail actually lives.
          pnpm exec stryker run \
            --incremental \
            --incrementalFile reports/mutation/incremental.json \
            --reporters clear-text,html \
            --allowConsoleColors false \
            "${args[@]}" \
            | tee stryker.log

      # The score lives in the clear-text table's "All files" row. Parsed rather
      # than read from a machine-readable file because Stryker's JSON report
      # carries the per-mutant verdicts, not the computed score.
      - name: Summarise
        if: always() && steps.scope.outputs.skip != 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          # `stryker.log` is a TERMINAL transcript, not a text file. The progress
          # reporter redraws its bar with carriage returns and colours everything
          # with ANSI escapes, so what `tee` captured has very few newlines in it:
          # measured on the 2026-09-13 nightly, 20 "lines" of it came to 1.9MB.
          #
          # That is what broke this step. `head -20` caps LINES, so it happily let
          # ~95KB per line through, and GitHub aborts the WHOLE job summary above
          # 1024k — "upload aborted ... got 1895k". The run's own documentation
          # says the number in the job summary is the thing to read, and there was
          # never a summary to read it in.
          #
          # So flatten the transcript first: carriage returns become newlines, the
          # escape sequences go, and the result is the line-oriented text the
          # greps below have always assumed they were reading.
          tr '\r' '\n' < stryker.log | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' > stryker.txt

          score=$(grep -E '^[[:space:]]*All files' stryker.txt | head -1 | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          {
            echo "## Mutation score — ${{ matrix.app }}"
            echo
            echo "**${score:-unknown}%**"
            echo
            echo '```'
            # The whole clear-text table, from its header to the end of the log.
            #
            # The old filter matched `File`, `All files` and separator rows only,
            # so the per-file rows — the ones that say WHERE the gaps are — never
            # appeared and the block was three lines of totals. #245 is a hunt for
            # blind spots; the table is the map.
            #
            # Capped twice on purpose. The line cap is the intent; the byte cap is
            # what guarantees the summary still uploads if the log ever surprises
            # us again, because GitHub discards the ENTIRE summary over 1024k
            # rather than truncating it. Losing the tail of a table beats losing
            # the score with it.
            awk '/^[[:space:]]*File[[:space:]]*\|/{f=1} f{ if ($0 ~ /\|/) print; else exit }' stryker.txt | head -200 | head -c 20000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML report
        if: always() && steps.scope.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/reports/mutation/
          retention-days: 14
