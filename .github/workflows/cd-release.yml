name: CD — Release

on:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  # ── Compute tags ─────────────────────────────────────────────────────────────
  tags:
    name: Compute tags
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.tags.outputs.short_sha }}
      tag: ${{ steps.tags.outputs.tag }}
      sha-tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - name: Set Docker tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF_NAME}" in
            main)
              echo "tag=latest"            >> "$GITHUB_OUTPUT"
              echo "sha_tag=${SHORT_SHA}"  >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "tag=staging"                    >> "$GITHUB_OUTPUT"
              echo "sha_tag=staging-${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "tag=dev"                        >> "$GITHUB_OUTPUT"
              echo "sha_tag=dev-${SHORT_SHA}"       >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ── Build & Push — one native runner per architecture ───────────────────────
  #
  # Both images used to be built for linux/amd64,linux/arm64 on one amd64 runner,
  # which means the arm64 half ran under QEMU. Node does not survive that: the
  # frontend release of 2026-08-26 died with
  #
  #   qemu: uncaught target signal 4 (Illegal instruction) - core dumped
  #   [ERROR] Command was killed with SIGILL … pnpm install
  #
  # partway through `pnpm --filter frontend build`. The backend got through, so
  # the two images went out of step: the dev host ran a frontend image an hour
  # older than its backend, and every fix merged in between was simply not there.
  # That is the worst shape this failure can take — a red workflow that still
  # deploys something.
  #
  # GitHub gives public repositories free native arm64 runners, so neither
  # architecture needs emulating. Each leg pushes BY DIGEST — no tag — and the
  # merge job below assembles the multi-arch manifest. A leg that fails therefore
  # publishes nothing at all, rather than half an image under a real tag.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [tags]
    strategy:
      # Both architectures are reported, so one failure does not hide the other.
      fail-fast: false
      matrix:
        image: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          # No tags here on purpose: a tag would make this leg's single-arch
          # image the thing `:dev` points at, and the second leg would then
          # overwrite it. The manifest below is what gets tagged.
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/infrashelf-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Per architecture, or the two legs overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The filename IS the digest, minus the `sha256:` prefix — the merge job
      # rebuilds the reference from it, so nothing has to be passed between jobs
      # as an output.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the multi-arch manifest ────────────────────────────────────────
  #
  # `needs: build` waits for EVERY leg of the matrix, so a tag is only ever moved
  # once both architectures exist. This is what replaces the old behaviour where
  # a half-failed release still published one image.
  manifest:
    name: Manifest ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [tags, build]
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/infrashelf-${{ matrix.image }}
          TAG: ${{ needs.tags.outputs.tag }}
          SHA_TAG: ${{ needs.tags.outputs.sha-tag }}
        run: |
          set -euo pipefail
          # One -t per tag, one image reference per digest file.
          docker buildx imagetools create \
            -t "$REPO:$TAG" \
            -t "$REPO:$SHA_TAG" \
            $(printf "$REPO@sha256:%s " *)

      - name: Show what was published
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/infrashelf-${{ matrix.image }}
          TAG: ${{ needs.tags.outputs.tag }}
        run: docker buildx imagetools inspect "$REPO:$TAG"

  # ── Publish GitHub Release (main only) ───────────────────────────────────────
  release:
    name: Publish GitHub Release
    if: github.ref_name == 'main'
    needs: [tags, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The handbook includes four figures rendered from
      # docs/architecture/workspace.dsl, and they are not committed. Without this
      # the LaTeX step below cannot find them and `-halt-on-error` fails the
      # release — so this step is what keeps releases building at all.
      #
      # `make diagrams-png`, the same command CI and a developer's machine run.
      - name: Render the C4 diagrams
        run: make diagrams-png

      - name: Compile handbook (LaTeX)
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: handbook.tex
          working_directory: docs
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "Release #${{ github.run_number }} (${{ needs.tags.outputs.short-sha }})"
          body: |
            ## Commit

            ${{ github.event.head_commit.message }}

            **SHA:** [`${{ needs.tags.outputs.short-sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ## Docker Images

            ```bash
            # Backend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/infrashelf-backend:${{ needs.tags.outputs.sha-tag }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/infrashelf-backend:latest

            # Frontend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/infrashelf-frontend:${{ needs.tags.outputs.sha-tag }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/infrashelf-frontend:latest
            ```

            See `infra/docker-host/docker-compose.yml` for the full Docker host deployment configuration.
          files: |
            docs/handbook.pdf
          draft: false
          prerelease: false
          make_latest: true
