# Dependabot, held behind pnpm's minimumReleaseAge gate.
#
# The gate (`ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION`, pnpm 11) rejects a
# lockfile entry published inside the last 24 h. That is the right default — a
# package hours old is the shape a compromised release arrives in — but with no
# cooldown Dependabot opens the PR the day a version lands, so the bump fails at
# `pnpm install --frozen-lockfile` before a single test runs and the queue fills
# with red PRs (#569, PR #564).
#
# `cooldown.default-days` makes Dependabot wait until a release is older than
# the window before proposing it, so a bump arrives already installable.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
